[package]
name = "lv24-seo-desktop"
version = "0.2.3"
description = "LV24 SEO Optimizer desktop shell"
authors = ["LV24"]
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/LevapVeeskela/lv24-seo-optimizer-desktop"

[lib]
name = "lv24_seo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
toml_edit = "0.25"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
