name: Desktop build

# Manual only. There are no push, pull-request or tag triggers: a release must be
# started by the owner and approved through the `desktop-release` environment.
on:
  workflow_dispatch:
    inputs:
      engine_version:
        description: "Pinned lv24-seo engine version (must match scripts/cli-checksums.json)"
        required: true
        default: "0.8.0"
        type: string
      signed:
        description: "Request OS code signing/notarization (requires paid certificates; leave false)"
        required: true
        default: false
        type: boolean
      publish:
        description: "Create a GitHub release after every matrix build passes (owner only)"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag vX.Y.Z (required when publish=true)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags are needed to prove an existing release tag points at this commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate versions and tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const tag = (process.env.TAG || "").trim();
          const publish = process.env.PUBLISH === "true";
          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const problems = [];

          const packageVersion = String(readJson("package.json").version);
          const tauriVersion = String(readJson("src-tauri/tauri.conf.json").version);
          const cargoLines = fs
            .readFileSync("src-tauri/Cargo.toml", "utf8")
            .replace(/\r\n/g, "\n")
            .split("\n");
          const packageIndex = cargoLines.indexOf("[package]");
          let cargoVersion;
          if (packageIndex >= 0) {
            for (let i = packageIndex + 1; i < cargoLines.length; i += 1) {
              if (cargoLines[i].startsWith("[")) break;
              const match = /^version\s*=\s*"([^"]+)"/.exec(cargoLines[i]);
              if (match) {
                cargoVersion = match[1];
                break;
              }
            }
          }

          if (!cargoVersion) {
            problems.push("could not read [package] version from src-tauri/Cargo.toml");
          }
          for (const [name, value] of [
            ["package.json", packageVersion],
            ["src-tauri/tauri.conf.json", tauriVersion],
            ["src-tauri/Cargo.toml", cargoVersion],
          ]) {
            if (!value || !/^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$/.test(value)) {
              problems.push(`${name}: invalid semver version ${JSON.stringify(value)}`);
            }
          }
          if (packageVersion !== tauriVersion || packageVersion !== cargoVersion) {
            problems.push(
              `versions disagree: package.json=${packageVersion}, tauri.conf.json=${tauriVersion}, Cargo.toml=${cargoVersion}`,
            );
          }

          if (publish && !tag) {
            problems.push("publish=true requires a vX.Y.Z tag");
          }

          if (tag) {
            if (!/^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$/.test(tag)) {
              problems.push(`tag must look like vX.Y.Z; got ${JSON.stringify(tag)}`);
            } else if (tag.slice(1) !== packageVersion) {
              problems.push(`tag ${tag} does not match package.json version ${packageVersion}`);
            }

            let tagCommit = "";
            try {
              tagCommit = execFileSync(
                "git",
                ["rev-parse", "--verify", "--quiet", `refs/tags/${tag}^{commit}`],
                { encoding: "utf8" },
              ).trim();
            } catch {
              tagCommit = "";
            }
            if (tagCommit && tagCommit !== process.env.GITHUB_SHA) {
              problems.push(
                `tag ${tag} points at ${tagCommit}, but this workflow runs at ${process.env.GITHUB_SHA}`,
              );
            }
            if (!tagCommit) {
              console.log(
                `::notice::tag ${tag} does not exist yet; the release job will create it at ${process.env.GITHUB_SHA}`,
              );
            }
          }

          if (problems.length > 0) {
            for (const problem of problems) console.error(`::error::${problem}`);
            process.exit(1);
          }
          console.log(
            `versions: package.json=${packageVersion}, tauri.conf.json=${tauriVersion}, Cargo.toml=${cargoVersion}`,
          );
          if (tag) console.log(`tag: ${tag}`);
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            artifact: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            artifact: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: macos-arm64
            artifact: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg,app
          - name: macos-x64
            artifact: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg,app
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install web dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install pinned Python
        run: uv python install 3.12

      - name: Set up Rust
        # Pinned so a release rebuild uses the reviewed compiler, not whatever
        # `stable` is on the runner that day.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 patchelf rpm

      - name: Warn about Windows signing
        if: inputs.signed && runner.os == 'Windows'
        run: echo "::warning::Windows Authenticode is not configured in this zero-spend repository; the artifact remains unsigned."

      - name: Require macOS signing credentials
        if: inputs.signed && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::signed=true but APPLE_CERTIFICATE is not configured; refusing to claim a signed build"
            exit 1
          fi

      - name: Require updater signing key for publish
        if: inputs.publish
        shell: bash
        env:
          UPDATER_SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$UPDATER_SIGNING_ENABLED" != "true" ]; then
            echo "::error::publish=true requires TAURI_SIGNING_PRIVATE_KEY; refusing to publish without updater artifacts"
            exit 1
          fi

      - name: Build onedir sidecar
        run: >
          uv run --python 3.12 python scripts/build-sidecar.py
          --engine-version "${{ inputs.engine_version }}"
          --target "${{ matrix.target }}"
          --out src-tauri/engine

      - name: Prepare checksum report directory
        # The report must live inside the workspace: upload-artifact cannot read
        # paths outside GITHUB_WORKSPACE (the old runner.temp path was ignored).
        run: |
          node -e "require('fs').mkdirSync('release', { recursive: true })"

      - name: Verify sidecar and record the built checksum
        # PyInstaller onedir output is not byte-reproducible, so a CI rebuild
        # cannot match the reviewed local pin. --no-hash still verifies the
        # target, executable and engine version, and records the actual SHA-256.
        run: >
          node scripts/verify-sidecar.mjs
          --root src-tauri/engine
          --target "${{ matrix.target }}"
          --engine-version "${{ inputs.engine_version }}"
          --no-hash
          --report "release/sidecar-checksums-${{ matrix.target }}.json"

      - name: Ad-hoc sign bundled macOS sidecar
        # Tauri copies engine/lv24-seo as a resource, not as nested code, so the
        # PyInstaller Mach-O tree must already carry an ad-hoc signature before
        # the app bundle is sealed. Non-Mach-O files (scripts, .pyc, JSON) are
        # left untouched.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="src-tauri/engine/lv24-seo"
          signed=0
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              codesign --force --sign - "$file"
              signed=$((signed + 1))
            fi
          done < <(find "$root" -type f -print0)
          if [ "$signed" -eq 0 ]; then
            echo "::error::no Mach-O files found under $root; the sidecar tree looks wrong"
            exit 1
          fi
          echo "ad-hoc signed $signed Mach-O files under $root"

      - name: Write CI Tauri config
        # The committed config enables updater artifacts. The CI override keeps
        # that true when the updater key exists and disables it for build-only
        # runs without the key, so forks and local CI can still bundle. Tauri
        # 2.12.4 boolean mode signs the NSIS setup .exe (and the AppImage on
        # Linux) directly; the staging script also accepts v1Compatible
        # .nsis.zip/.AppImage.tar.gz artifacts from other Tauri versions.
        env:
          TAURI_CI_CONFIG: ${{ runner.temp }}/tauri.ci.json
          UNSIGNED_MAC: ${{ runner.os == 'macOS' && inputs.signed == false }}
          UPDATER_SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "const fs=require('fs'); const p=process.env.TAURI_CI_CONFIG; const base=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); const cfg={bundle:{resources:{'engine/lv24-seo/':'engine/lv24-seo/'},createUpdaterArtifacts:process.env.UPDATER_SIGNING_ENABLED==='true'}}; if (process.env.UNSIGNED_MAC === 'true') { cfg.bundle.macOS={...(base.bundle.macOS||{}),signingIdentity:'-',hardenedRuntime:false}; } fs.writeFileSync(p, JSON.stringify(cfg));"

      - name: Build Tauri installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ inputs.signed && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.signed && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          # Empty APPLE_* values are not "unset" for Tauri: an empty
          # APPLE_CERTIFICATE makes the macOS bundler try to import an empty
          # certificate. Remove every empty Apple variable on the unsigned path.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              unset "$var"
            fi
          done
          npm run tauri build -- \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "${{ runner.temp }}/tauri.ci.json"

      - name: Package portable ZIP
        if: runner.os == 'Windows'
        run: node scripts/package-portable.mjs --target "${{ matrix.target }}"

      - name: Stage release assets
        # upload-artifact stores files relative to the least common ancestor of
        # all `path` entries. Everything goes through release/ so the artifact
        # root is flat. The staging script also normalizes spaces to dots and
        # writes updater-<platform>.json for the release job.
        shell: bash
        env:
          UPDATER_SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(--target "${{ matrix.target }}")
          if [ "$UPDATER_SIGNING_ENABLED" = "true" ] || [ "$PUBLISH" = "true" ]; then
            args+=(--require-updater)
          fi
          node scripts/stage-release-assets.mjs "${args[@]}"
          ls -la release

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: release/*

  release:
    name: Owner-gated release
    needs: [preflight, build]
    if: inputs.publish && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must look like vX.Y.Z; got '$TAG'"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require a sidecar checksum report for every shipped target
        # Rebuild-aware gate. PyInstaller onedir output is not byte-reproducible,
        # so the reviewed pin in scripts/cli-checksums.json cannot match a CI
        # rebuild. The build job records the actual SHA-256 of each built
        # sidecar; this gate requires one valid report per shipped target and
        # keeps the repo manifest authoritative only for the engine version.
        shell: bash
        env:
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          // Keep in sync with the build matrix above.
          const shippedTargets = [
            "x86_64-pc-windows-msvc",
            "x86_64-unknown-linux-gnu",
            "aarch64-apple-darwin",
            "x86_64-apple-darwin",
          ];
          const engineVersion = process.env.ENGINE_VERSION;
          const problems = [];

          const pin = JSON.parse(fs.readFileSync("scripts/cli-checksums.json", "utf8"));
          if (String(pin.version) !== engineVersion) {
            problems.push(
              `scripts/cli-checksums.json pins engine ${pin.version}, workflow was run with ${engineVersion}`,
            );
          }

          const reports = new Map();
          for (const name of fs.readdirSync("dist")) {
            const match = /^sidecar-checksums-(.+)\.json$/.exec(name);
            if (match) reports.set(match[1], path.join("dist", name));
          }

          for (const target of shippedTargets) {
            const file = reports.get(target);
            if (!file) {
              problems.push(`${target}: no sidecar-checksums report in dist/`);
              continue;
            }
            let report;
            try {
              report = JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              problems.push(`${target}: invalid JSON (${error.message})`);
              continue;
            }
            if (report.target !== target) {
              problems.push(`${target}: report says target ${JSON.stringify(report.target)}`);
            }
            if (report.hashPolicy !== "rebuild") {
              problems.push(`${target}: report was not produced with --no-hash`);
            }
            if (report.ok !== true || (Array.isArray(report.errors) && report.errors.length > 0)) {
              problems.push(`${target}: verifier reported errors (${(report.errors || []).join("; ")})`);
            }
            if (!/^[a-f0-9]{64}$/.test(String(report.sha256 || ""))) {
              problems.push(`${target}: sha256 is not a 64-hex digest`);
            }
            if (report.expectedVersion !== engineVersion || report.actualVersion !== engineVersion) {
              problems.push(
                `${target}: engine version ${JSON.stringify(report.actualVersion)} != ${engineVersion}`,
              );
            }
            if (!Number.isInteger(report.size) || report.size <= 0) {
              problems.push(`${target}: sidecar size is missing`);
            }
          }

          for (const target of reports.keys()) {
            if (!shippedTargets.includes(target)) {
              console.log(`note: ignoring unshipped report for ${target}`);
            }
          }

          if (problems.length > 0) {
            for (const problem of problems) console.error(`::error::${problem}`);
            console.error(
              "Refusing to publish: every shipped target needs a valid CI sidecar checksum report.",
            );
            process.exit(1);
          }
          for (const target of shippedTargets) {
            const report = JSON.parse(fs.readFileSync(reports.get(target), "utf8"));
            console.log(`${target}  ${report.sha256}  ${report.size} bytes`);
          }
          NODE

      - name: Normalize and flatten release asset names
        # GitHub rewrites spaces in release asset names. Normalize before
        # checksums/upload so SHA256SUMS.txt and latest.json always reference the
        # name GitHub actually stores. This is also a collision gate: arm64 and
        # x64 macOS updater archives must have different basenames.
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dist = path.resolve("dist");

          function walk(dir) {
            const result = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) result.push(...walk(full));
              else if (entry.isFile()) result.push(full);
            }
            return result;
          }

          const files = walk(dist);
          const seen = new Map();
          const problems = [];
          for (const file of files) {
            const base = path.basename(file).replace(/\s+/g, ".");
            if (!/^[A-Za-z0-9._-]+$/.test(base)) {
              problems.push(`${file}: name contains characters GitHub may rewrite`);
              continue;
            }
            if (seen.has(base)) {
              problems.push(`duplicate asset basename ${base}: ${seen.get(base)} and ${file}`);
              continue;
            }
            seen.set(base, file);
          }
          if (problems.length > 0) {
            for (const problem of problems) console.error(`::error::${problem}`);
            process.exit(1);
          }

          for (const [base, file] of seen) {
            const target = path.join(dist, base);
            if (path.resolve(file) !== path.resolve(target)) {
              if (fs.existsSync(target)) {
                console.error(`::error::refusing to overwrite ${target} while flattening ${file}`);
                process.exit(1);
              }
              fs.renameSync(file, target);
            }
          }

          function prune(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const full = path.join(dir, entry.name);
              prune(full);
              if (fs.readdirSync(full).length === 0) fs.rmdirSync(full);
            }
          }
          prune(dist);

          const flat = fs.readdirSync(dist).filter((name) => fs.statSync(path.join(dist, name)).isFile()).sort();
          console.log(`flat release files: ${flat.length}`);
          for (const name of flat) console.log(`  ${name}`);
          NODE

      - name: Merge latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-latest-json.mjs \
            --dist dist \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "docs/releases/${VERSION}-update.md"

      - name: Validate latest.json against the contract schema
        # The updater plugin is the real consumer; a manifest it rejects must
        # never reach a published release (QA-02).
        shell: bash
        run: node scripts/validate-latest-json.mjs --file dist/latest.json

      - name: Verify expected release assets
        # Explicit gate independent of the merge script: the release must contain
        # every installer and updater signature for all four platforms, and
        # latest.json must reference only files that exist under their published
        # dotted names.
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const dist = "dist";
          const files = fs.readdirSync(dist).filter((name) => fs.statSync(path.join(dist, name)).isFile());
          const problems = [];
          const by = (regex) => files.filter((name) => regex.test(name));
          const exactly = (regex, count, label) => {
            const matches = by(regex);
            if (matches.length !== count) {
              problems.push(`${label}: expected ${count}, found ${matches.length} (${matches.join(", ") || "none"})`);
            }
            return matches;
          };

          const setup = exactly(/-setup\.exe$/, 1, "Windows NSIS installer");
          const nsis = by(/\.nsis\.zip$/);
          const nsisSig = by(/\.nsis\.zip\.sig$/);
          const exeSig = by(/-setup\.exe\.sig$/);
          let windowsVariant;
          if (setup.length === 1 && exeSig.length === 1) {
            windowsVariant = "setup.exe";
          } else if (nsis.length === 1 && nsisSig.length === 1) {
            windowsVariant = "nsis.zip";
          } else {
            problems.push(`Windows updater: found neither setup.exe+.exe.sig nor .nsis.zip+.nsis.zip.sig`);
          }

          exactly(/\.AppImage$/, 1, "Linux AppImage");
          exactly(/\.deb$/, 1, "Linux deb package");
          exactly(/\.rpm$/, 1, "Linux rpm package");
          const appImageTar = by(/\.AppImage\.tar\.gz$/);
          const appImageTarSig = by(/\.AppImage\.tar\.gz\.sig$/);
          const appImageSig = by(/\.AppImage\.sig$/);
          let linuxVariant;
          if (appImageSig.length === 1) {
            linuxVariant = "AppImage";
          } else if (appImageTar.length === 1 && appImageTarSig.length === 1) {
            linuxVariant = "AppImage.tar.gz";
          } else {
            problems.push(`Linux updater: found neither AppImage+.sig nor .AppImage.tar.gz+.sig`);
          }

          const dmgs = exactly(/\.dmg$/, 2, "macOS DMG");
          exactly(/\.app\.tar\.gz$/, 2, "macOS updater archive");
          exactly(/\.app\.tar\.gz\.sig$/, 2, "macOS updater signature");
          if (!dmgs.some((name) => name.includes("_aarch64.dmg"))) problems.push("macOS DMGs: no arm64 DMG");
          if (!dmgs.some((name) => name.includes("_x64.dmg"))) problems.push("macOS DMGs: no x64 DMG");

          // Windows also ships a portable ZIP with its own .sha256 sidecar.
          // Both are published (QA-08) and the sidecar must match the archive
          // bytes the user downloads.
          const portable = exactly(/-portable\.zip$/, 1, "Windows portable ZIP");
          const portableSums = exactly(/-portable\.zip\.sha256$/, 1, "Windows portable checksum");
          if (portable.length === 1 && portableSums.length === 1) {
            const digest = crypto
              .createHash("sha256")
              .update(fs.readFileSync(path.join(dist, portable[0])))
              .digest("hex");
            const expected = `${digest}  ${portable[0]}`;
            const actual = fs.readFileSync(path.join(dist, portableSums[0]), "utf8").trim();
            if (actual !== expected) {
              problems.push(`portable checksum ${portableSums[0]} does not match ${portable[0]}`);
            }
          }

          let latest;
          try {
            latest = JSON.parse(fs.readFileSync(path.join(dist, "latest.json"), "utf8"));
          } catch (error) {
            problems.push(`latest.json: ${error.message}`);
          }
          if (latest) {
            for (const key of ["windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64"]) {
              if (!latest.platforms || !latest.platforms[key]) problems.push(`latest.json: missing platform ${key}`);
            }
            for (const key of ["windows-x86_64-nsis", "linux-x86_64-appimage", "darwin-aarch64-app", "darwin-x86_64-app"]) {
              if (!latest.platforms || !latest.platforms[key]) problems.push(`latest.json: missing bundle alias ${key}`);
            }
            const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/`;
            for (const [key, entry] of Object.entries(latest.platforms || {})) {
              if (typeof entry.signature !== "string" || entry.signature.length < 64) {
                problems.push(`latest.json: ${key} signature is missing or too short`);
              }
              if (typeof entry.url !== "string" || !entry.url.startsWith(prefix)) {
                problems.push(`latest.json: ${key} URL is not under ${prefix}`);
                continue;
              }
              const asset = entry.url.slice(prefix.length);
              if (asset.includes("/") || !files.includes(asset)) {
                problems.push(`latest.json: ${key} references missing asset ${asset}`);
              }
            }
            if (latest.version !== process.env.VERSION) {
              problems.push(`latest.json: version ${latest.version} != ${process.env.VERSION}`);
            }
            if (typeof latest.pub_date !== "string" || !latest.pub_date.endsWith("Z")) {
              problems.push("latest.json: pub_date is not RFC3339 UTC");
            }
          }

          if (problems.length > 0) {
            for (const problem of problems) console.error(`::error::${problem}`);
            process.exit(1);
          }
          console.log(`windows variant: ${windowsVariant}`);
          console.log(`linux variant:   ${linuxVariant}`);
          console.log(`platforms:       ${Object.keys(latest.platforms).join(", ")}`);
          NODE

      - name: Generate checksums
        # The published allowlist lives in scripts/release-assets.mjs so the
        # checksum list, the upload list and their tests cannot drift (QA-08).
        # Internal build-info/sidecar-report JSON stays in dist/ but is not
        # published, and latest.json must reference only allowlisted assets.
        shell: bash
        run: node scripts/release-assets.mjs --dist dist --write

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## LV24 SEO Optimizer Desktop ${TAG}

          Engine: lv24-seo ${{ inputs.engine_version }} (bundled PyInstaller onedir sidecar)
          Platforms: Windows x64 (NSIS installer + portable ZIP), Linux x64 (AppImage, deb, rpm), macOS arm64/x64 (DMG)

          Signing requested: ${{ inputs.signed }}
          Default policy: macOS ad-hoc signature only; Windows unsigned; Linux packages unsigned.
          Gatekeeper, SmartScreen and Smart App Control may warn. Verify SHA256SUMS.txt before installing.
          See the README for the documented first-launch flow. No paid signing or notarization is used.

          Auto-update: latest.json and signed updater assets are attached for Windows NSIS (setup .exe), macOS arm64/x64 (.app.tar.gz) and Linux AppImage.
          Linux deb/rpm entries are included when Tauri produced their signatures; otherwise upgrade those packages manually.
          Updater manifest: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft-state 2>/dev/null; then
            if [ "$(cat draft-state)" != "true" ]; then
              echo "::error::release $TAG already exists and is published; refusing to overwrite it"
              exit 1
            fi
            echo "Reusing existing draft release $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "LV24 SEO Optimizer Desktop $TAG" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The release is still a draft here. Clear assets from a previous
          # attempt so a rerun publishes exactly the current allowlist.
          while IFS= read -r asset; do
            if [ -n "$asset" ]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          files=()
          # The upload list comes from the same tested allowlist as
          # SHA256SUMS.txt (scripts/release-assets.mjs); the workflow no longer
          # keeps its own bash `case` that could drift (QA-08).
          list_file="$RUNNER_TEMP/upload-assets"
          node scripts/release-assets.mjs --dist dist --list0 > "$list_file"
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < "$list_file"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no publishable assets found in dist/"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$TAG" --draft=false

      - name: Verify published asset names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { execFileSync } = require("child_process");
          const fs = require("fs");

          const release = JSON.parse(
            execFileSync("gh", ["release", "view", process.env.TAG, "--json", "isDraft,assets"], {
              encoding: "utf8",
            }),
          );
          if (release.isDraft) {
            console.error("::error::release is still a draft");
            process.exit(1);
          }

          const remote = release.assets.map((asset) => asset.name).sort();
          const expected = fs
            .readFileSync("dist/SHA256SUMS.txt", "utf8")
            .trim()
            .split("\n")
            .map((line) => line.split("  ").slice(1).join("  "));
          expected.push("SHA256SUMS.txt");
          expected.sort();

          const missing = expected.filter((name) => !remote.includes(name));
          const extra = remote.filter((name) => !expected.includes(name));
          if (missing.length > 0 || extra.length > 0) {
            if (missing.length) console.error(`::error::release is missing: ${missing.join(", ")}`);
            if (extra.length) console.error(`::error::release has unpublished extras: ${extra.join(", ")}`);
            process.exit(1);
          }
          console.log(`published assets (${remote.length}):`);
          for (const name of remote) console.log(`  ${name}`);
          NODE
