name: Desktop build

# Manual only. There are no push, pull-request or tag triggers: a release must be
# started by the owner and approved through the `desktop-release` environment.
on:
  workflow_dispatch:
    inputs:
      engine_version:
        description: "Pinned lv24-seo engine version (must match scripts/cli-checksums.json)"
        required: true
        default: "0.5.0"
        type: string
      signed:
        description: "Request OS code signing/notarization (requires paid certificates; leave false)"
        required: true
        default: false
        type: boolean
      publish:
        description: "Create a GitHub release after every matrix build passes (owner only)"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag vX.Y.Z (required when publish=true)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            artifact: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            artifact: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: macos-arm64
            artifact: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            artifact: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install web dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install pinned Python
        run: uv python install 3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 rpm

      - name: Warn about Windows signing
        if: inputs.signed && runner.os == 'Windows'
        run: echo "::warning::Windows Authenticode is not configured in this zero-spend repository; the artifact remains unsigned."

      - name: Require macOS signing credentials
        if: inputs.signed && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::signed=true but APPLE_CERTIFICATE is not configured; refusing to claim a signed build"
            exit 1
          fi

      - name: Build onedir sidecar
        run: >
          uv run --python 3.12 python scripts/build-sidecar.py
          --engine-version "${{ inputs.engine_version }}"
          --target "${{ matrix.target }}"
          --out src-tauri/engine

      - name: Prepare checksum report directory
        # The report must live inside the workspace: upload-artifact cannot read
        # paths outside GITHUB_WORKSPACE (the old runner.temp path was ignored).
        run: |
          node -e "require('fs').mkdirSync('release', { recursive: true })"

      - name: Verify sidecar and record the built checksum
        # PyInstaller onedir output is not byte-reproducible, so a CI rebuild
        # cannot match the reviewed local pin. --no-hash still verifies the
        # target, executable and engine version, and records the actual SHA-256.
        run: >
          node scripts/verify-sidecar.mjs
          --root src-tauri/engine
          --target "${{ matrix.target }}"
          --engine-version "${{ inputs.engine_version }}"
          --no-hash
          --report "release/sidecar-checksums-${{ matrix.target }}.json"

      - name: Write CI Tauri config
        env:
          TAURI_CI_CONFIG: ${{ runner.temp }}/tauri.ci.json
          UNSIGNED_MAC: ${{ runner.os == 'macOS' && inputs.signed == false }}
        run: |
          node -e "const fs=require('fs'); const p=process.env.TAURI_CI_CONFIG; const cfg={bundle:{resources:{'engine/lv24-seo/':'engine/lv24-seo/'}}}; if (process.env.UNSIGNED_MAC === 'true') { cfg.bundle.macOS={signingIdentity:'-'}; } if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { cfg.bundle.createUpdaterArtifacts=false; } fs.writeFileSync(p, JSON.stringify(cfg));"

      - name: Build Tauri installers
        env:
          APPLE_CERTIFICATE: ${{ inputs.signed && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.signed && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
        run: >
          npm run tauri build --
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --config "${{ runner.temp }}/tauri.ci.json"

      - name: Package portable ZIP
        if: runner.os == 'Windows'
        run: node scripts/package-portable.mjs --target "${{ matrix.target }}"

      - name: Stage release assets
        # upload-artifact stores files relative to the least common ancestor of
        # all `path` entries. Mixing src-tauri/target/... with release/* made the
        # artifact root the repository root, so the release job could not find
        # the checksum reports or the portable ZIP. Everything now goes through
        # release/ so the artifact root is flat.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          copied=0
          for bundle in nsis dmg appimage deb rpm; do
            for file in "src-tauri/target/${{ matrix.target }}/release/bundle/$bundle"/*; do
              [ -f "$file" ] || continue
              case "$file" in
                *.exe|*.msi|*.dmg|*.AppImage|*.deb|*.rpm|*.sig)
                  cp "$file" release/
                  copied=$((copied + 1))
                  ;;
                *)
                  echo "note: not a release asset, skipping $file"
                  ;;
              esac
            done
          done
          if [ "$copied" -eq 0 ]; then
            echo "::error::no installer bundles found under src-tauri/target/${{ matrix.target }}/release/bundle"
            exit 1
          fi
          latest="src-tauri/target/${{ matrix.target }}/release/bundle/latest.json"
          if [ -f "$latest" ]; then
            cp "$latest" release/
          fi
          cp src-tauri/engine/build-info.json "release/build-info-${{ matrix.target }}.json"
          # package-portable.mjs stages a full copy of the app under
          # release/portable; upload-artifact recurses into directories, so drop
          # the staging tree to avoid uploading the payload twice.
          rm -rf "release/portable"
          ls -la release

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: release/*

  release:
    name: Owner-gated release
    needs: build
    if: inputs.publish && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must look like vX.Y.Z; got '$TAG'"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Require a sidecar checksum report for every shipped target
        # Rebuild-aware gate. PyInstaller onedir output is not byte-reproducible,
        # so the reviewed pin in scripts/cli-checksums.json cannot match a CI
        # rebuild. The build job records the actual SHA-256 of each built
        # sidecar; this gate requires one valid report per shipped target and
        # keeps the repo manifest authoritative only for the engine version.
        shell: bash
        env:
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          // Keep in sync with the build matrix above.
          const shippedTargets = [
            "x86_64-pc-windows-msvc",
            "x86_64-unknown-linux-gnu",
            "aarch64-apple-darwin",
            "x86_64-apple-darwin",
          ];
          const engineVersion = process.env.ENGINE_VERSION;
          const problems = [];

          const pin = JSON.parse(fs.readFileSync("scripts/cli-checksums.json", "utf8"));
          if (String(pin.version) !== engineVersion) {
            problems.push(
              `scripts/cli-checksums.json pins engine ${pin.version}, workflow was run with ${engineVersion}`,
            );
          }

          const reports = new Map();
          for (const name of fs.readdirSync("dist")) {
            const match = /^sidecar-checksums-(.+)\.json$/.exec(name);
            if (match) reports.set(match[1], path.join("dist", name));
          }

          for (const target of shippedTargets) {
            const file = reports.get(target);
            if (!file) {
              problems.push(`${target}: no sidecar-checksums report in dist/`);
              continue;
            }
            let report;
            try {
              report = JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              problems.push(`${target}: invalid JSON (${error.message})`);
              continue;
            }
            if (report.target !== target) {
              problems.push(`${target}: report says target ${JSON.stringify(report.target)}`);
            }
            if (report.hashPolicy !== "rebuild") {
              problems.push(`${target}: report was not produced with --no-hash`);
            }
            if (report.ok !== true || (Array.isArray(report.errors) && report.errors.length > 0)) {
              problems.push(`${target}: verifier reported errors (${(report.errors || []).join("; ")})`);
            }
            if (!/^[a-f0-9]{64}$/.test(String(report.sha256 || ""))) {
              problems.push(`${target}: sha256 is not a 64-hex digest`);
            }
            if (report.expectedVersion !== engineVersion || report.actualVersion !== engineVersion) {
              problems.push(
                `${target}: engine version ${JSON.stringify(report.actualVersion)} != ${engineVersion}`,
              );
            }
            if (!Number.isInteger(report.size) || report.size <= 0) {
              problems.push(`${target}: sidecar size is missing`);
            }
          }

          for (const target of reports.keys()) {
            if (!shippedTargets.includes(target)) {
              console.log(`note: ignoring unshipped report for ${target}`);
            }
          }

          if (problems.length > 0) {
            for (const problem of problems) console.error(`::error::${problem}`);
            console.error(
              "Refusing to publish: every shipped target needs a valid CI sidecar checksum report.",
            );
            process.exit(1);
          }
          for (const target of shippedTargets) {
            const report = JSON.parse(fs.readFileSync(reports.get(target), "utf8"));
            console.log(`${target}  ${report.sha256}  ${report.size} bytes`);
          }
          NODE

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          # download-artifact flattens the tree with merge-multiple, but hash by
          # path and publish by basename so nested artifact paths still work.
          mapfile -d '' -t assets < <(find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' \) -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release assets found in dist/"
            exit 1
          fi
          declare -A by_basename=()
          for file in "${assets[@]}"; do
            base="$(basename "$file")"
            if [ -n "${by_basename[$base]:-}" ]; then
              echo "::error::duplicate asset basename '$base' (${by_basename[$base]} and $file); SHA256SUMS.txt lines would be ambiguous"
              exit 1
            fi
            by_basename[$base]="$file"
          done
          : > dist/SHA256SUMS.txt
          for file in "${assets[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")" >> dist/SHA256SUMS.txt
          done
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## LV24 SEO Optimizer Desktop ${TAG}

          Engine: lv24-seo ${{ inputs.engine_version }} (bundled PyInstaller onedir sidecar)
          Platforms: Windows x64 (NSIS installer + portable ZIP), Linux x64 (AppImage, deb, rpm), macOS arm64/x64 (DMG)

          Signing requested: ${{ inputs.signed }}
          Default policy: macOS ad-hoc signature only; Windows unsigned; Linux packages unsigned.
          Gatekeeper, SmartScreen and Smart App Control may warn. Verify SHA256SUMS.txt before installing.
          See the README for the documented first-launch flow. No paid signing or notarization is used.

          Auto-update: not available in this release. Install/upgrade manually from the assets below.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "LV24 SEO Optimizer Desktop $TAG" \
            --notes-file release-notes.md
          find dist -type f -print0 | sort -z | xargs -0 -r gh release upload "$TAG" --clobber
