name: CI

# Public-repository standard runners only. CI runs on pull requests and on main;
# both are free for public repositories. Release builds stay manual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  contracts:
    name: Contracts (pinned engine)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install pinned Python
        run: uv python install 3.12

      - name: Check contract drift
        run: node scripts/check-contracts.mjs

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            # The release ships this target (macos-15-intel); build it on PRs too.
            os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        # The toolchain is pinned to the version the release was reviewed with;
        # `stable` would let a new compiler change the shipped binaries between
        # runs. Keep this in sync with the local release build.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Create placeholder engine resource
        # The committed tauri.conf.json maps engine/lv24-seo/ into the bundle.
        # The Rust checks do not build the PyInstaller sidecar, so the resource
        # path must exist for Tauri's build script. Release builds replace it.
        shell: bash
        run: mkdir -p src-tauri/engine/lv24-seo && touch src-tauri/engine/lv24-seo/.placeholder

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets

  audit:
    name: Dependency audit (npm, cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical)
        # Blocking: the tree is clean today, so a new high/critical advisory is a
        # real regression. Run `npm audit --omit=dev` for the shipped subset.
        run: npm audit --audit-level=high

      - name: Set up Rust
        # Same pinned compiler as the build matrix; cargo-audit is compiled here.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (RustSec vulnerabilities)
        # Exits non-zero only for vulnerabilities; unmaintained/unsound transitive
        # crates are warnings. The baseline is clean as of 0.2.3 (five warnings).
        working-directory: src-tauri
        run: cargo audit
